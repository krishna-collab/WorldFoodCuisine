<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#09090b" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="noindex" />
    <title>You’re offline · WorldFoodCuisine</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #09090b;
        --surface: #121214;
        --fg: #f4f1ea;
        --muted: #9a9590;
        --primary: #e8e4dc;
        --primary-fg: #12110f;
        --accent: #e2a13a;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
      main {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        padding: max(1.5rem, env(safe-area-inset-top)) 1.5rem
          max(1.5rem, env(safe-area-inset-bottom));
        text-align: center;
      }
      p.eyebrow {
        margin: 0;
        font-size: 0.875rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--accent);
      }
      h1 {
        margin: 0;
        font-size: clamp(1.75rem, 6vw, 2.5rem);
        line-height: 1.15;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0;
        max-width: 28rem;
        line-height: 1.6;
        color: var(--muted);
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.75rem;
        margin-top: 0.5rem;
      }
      button,
      a.button {
        min-height: 2.75rem;
        padding: 0 1.25rem;
        border-radius: 0.5rem;
        border: 0;
        font: inherit;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        text-decoration: none;
        cursor: pointer;
      }
      button {
        background: var(--primary);
        color: var(--primary-fg);
      }
      a.button {
        background: var(--surface);
        color: var(--fg);
        box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.12);
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">WorldFoodCuisine</p>
      <h1>You’re offline</h1>
      <p>
        This page hasn’t been saved on this device yet. Pages you’ve opened before still work
        offline. Ordering needs a connection.
      </p>
      <div class="actions">
        <button type="button" onclick="location.reload()">Try again</button>
        <a class="button" href="/">Home</a>
      </div>
    </main>
  </body>
</html>
